<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LogiSim ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f8f5f5;--surface:#ffffff;--surface2:#f5efef;--ink:#241a1b;--muted:#6d5a5c;--line:#e6d9da;--line2:#f0e6e6;
  --accent:#c8102e;--accent-ink:#ffffff;--accent-soft:#fbe1e4;
  --side:#1f1417;--side-ink:#d8c9ca;--side-active:#3a1b20;--side-line:#3a262a;
  --ok:#1b7a44;--ok-bg:#dcf2e4;--warn:#8a5700;--warn-bg:#fbeac6;--crit:#b3261e;--crit-bg:#fadbd8;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --console-bg:#160f10;--console-ink:#ece2e2;--console-dim:#a4888a;--console-accent:#ff6b6b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1a1213;--surface:#241a1b;--surface2:#2b1f20;--ink:#f1e8e8;--muted:#b69a9c;--line:#3d2c2e;--line2:#332527;
    --accent:#ff6b6b;--accent-ink:#1a0a0b;--accent-soft:#3a1216;
    --side:#120c0d;--side-ink:#d8c9ca;--side-active:#2b1518;--side-line:#331f22;
    --ok:#5fcf8a;--ok-bg:#15301f;--warn:#e6b450;--warn-bg:#362a10;--crit:#ff8a80;--crit-bg:#3a1a18;
    --console-bg:#0e0a0a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1a1213;--surface:#241a1b;--surface2:#2b1f20;--ink:#f1e8e8;--muted:#b69a9c;--line:#3d2c2e;--line2:#332527;
  --accent:#ff6b6b;--accent-ink:#1a0a0b;--accent-soft:#3a1216;
  --side:#120c0d;--side-ink:#d8c9ca;--side-active:#2b1518;--side-line:#331f22;
  --ok:#5fcf8a;--ok-bg:#15301f;--warn:#e6b450;--warn-bg:#362a10;--crit:#ff8a80;--crit-bg:#3a1a18;
  --console-bg:#0e0a0a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;line-height:1.25}
h2{font-size:16px}
h3{font-size:14px}
p{margin:0}
.mono{font-family:var(--mono)}
.small{font-size:12px}
.muted{color:var(--muted)}
.right{text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
input[type=number]{width:78px;padding:5px 7px;font-family:var(--mono)}

/* Login */
.login{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:100vh}
.login-side{background:var(--side);color:var(--side-ink);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.wordmark{font-family:var(--cond);font-weight:600;font-size:30px;letter-spacing:.01em;color:#fff;display:flex;align-items:center;gap:11px}
.wordmark span{color:#ff6b6b}
.wordmark svg{flex:none}
.login-side h1{color:#fff;font-size:26px;max-width:16ch;margin-top:20px}
.login-side p{max-width:38ch;color:var(--side-ink)}
.login-facts{display:grid;gap:10px;font-family:var(--mono);font-size:12px;color:#c9a7ab;border-top:1px solid var(--side-line);padding-top:18px}
.login-main{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-card{width:100%;max-width:420px;display:grid;gap:18px}
.login-card form{display:grid;gap:16px}
.msg{padding:9px 12px;border-radius:5px;font-size:13px}
.msg.err{background:var(--crit-bg);color:var(--crit)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.info{background:var(--accent-soft);color:var(--ink)}
details.teacher{border-top:1px solid var(--line);padding-top:14px}
details.teacher summary{cursor:pointer;color:var(--muted);font-size:13px}
details.teacher form{margin-top:12px;display:flex;gap:8px;align-items:flex-end}
details.teacher .field{flex:1}

/* Shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 10px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .wordmark{font-size:22px;padding:4px 10px 2px}
.org{padding:2px 10px 14px;font-size:12px;color:#c9a7ab;border-bottom:1px solid var(--side-line);margin-bottom:8px}
.org b{color:#fff;font-weight:600;display:block;font-size:13px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-ink);padding:8px 10px;border-radius:5px;cursor:pointer;font-weight:500}
.nav:hover{background:var(--side-active)}
.nav.on{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #ff6b6b}
.nav .n{background:#ff6b6b;color:#3a0b0d;border-radius:9px;font-size:11px;font-weight:600;padding:0 7px;min-width:20px;text-align:center}
.nav-sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6f8399;padding:12px 10px 4px}
.content{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px clamp(16px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top form{flex:1;min-width:0}
.qbar{display:flex;align-items:center;gap:8px;background:var(--console-bg);border-radius:5px;padding:0 10px}
.qbar span{font-family:var(--mono);color:var(--console-accent)}
.qbar input{background:transparent;border:0;color:var(--console-ink);font-family:var(--mono);padding:8px 0;outline:none}
.qbar:focus-within{outline:2px solid var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;white-space:nowrap}
main{padding:24px clamp(16px,3vw,32px) 48px;display:grid;gap:20px;align-content:start;max-width:1280px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--muted)}

/* Blocs */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.panel-b{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-align:left;cursor:pointer;display:grid;gap:2px}
.kpi:hover{border-color:var(--accent)}
.kpi b{font-size:28px;font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;display:grid;place-items:center;font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters>*{flex:1 1 160px}
.filters .grow{flex:2 1 240px}

/* Tables */
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tbody tr:hover td{background:var(--surface2)}
.t td.r,.t th.r{text-align:right}
.t .ref{font-family:var(--mono);font-size:12px;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.6);vertical-align:-1px;margin-right:6px}
.mx td.q{text-align:center;font-family:var(--mono);min-width:38px}
.mx td.q.l{background:var(--warn-bg);color:var(--warn);font-weight:600}
.mx td.q.z{background:var(--crit-bg);color:var(--crit);font-weight:600}
.mx th{text-align:center}
.mx th:first-child,.mx td:first-child{text-align:left}

/* Catalogue */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:left;cursor:pointer;display:grid;padding:0}
.card:hover{border-color:var(--accent)}
.card .pic{background:var(--surface2);padding:18px 14px 6px;border-bottom:1px solid var(--line2)}
.card .info{padding:12px 14px 14px;display:grid;gap:4px}
.card .brand{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .nm{font-weight:600}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.price{font-family:var(--mono);font-weight:500;font-size:15px}
.shoe{width:100%;height:auto;display:block}
.prod{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px}
.prod .pic{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:28px 24px 12px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}

/* Messagerie */
.mailbox{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);min-height:440px}
.mlist{border-right:1px solid var(--line);max-height:640px;overflow-y:auto}
.mitem{display:grid;gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:11px 14px;cursor:pointer}
.mitem:hover{background:var(--surface2)}
.mitem.on{background:var(--accent-soft)}
.mitem .from{font-weight:500;display:flex;justify-content:space-between;gap:8px}
.mitem.unread .from,.mitem.unread .subj{font-weight:600}
.mitem.unread .from::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;align-self:center;flex:none}
.mitem .from span:first-child{flex:1;display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .subj{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mview{padding:18px 22px;display:grid;gap:14px;align-content:start;min-width:0}
.mview .mh{display:grid;gap:4px;border-bottom:1px solid var(--line2);padding-bottom:12px}
.back{display:none}
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:24px clamp(14px,3vw,30px);display:grid;gap:14px;font-size:13px}
.doc .t th{background:#eef0f3;color:#3a4453;border-bottom:1px solid #c9ced6}
.doc .t td{border-bottom:1px solid #dfe3e8}
.doc .t tbody tr:hover td{background:transparent}
.doc h2{font-size:18px;font-family:var(--cond)}
.doc .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.doc .cols>div{border:1px solid #c9ced6;border-radius:3px;padding:8px 10px}
.doc .lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#5b6675;font-weight:600}
.box{display:inline-block;width:14px;height:14px;border:1.5px solid #333;vertical-align:-2px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sign>div{border:1px solid #c9ced6;border-radius:3px;height:70px;padding:6px 8px}

/* Console */
.console{background:var(--console-bg);color:var(--console-ink);border-radius:6px;font-family:var(--mono);font-size:13px;display:grid;grid-template-rows:1fr auto;min-height:480px;max-height:70vh}
.cout{overflow:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.cmd{color:var(--console-accent)}
.cmd::before{content:"> ";color:var(--console-dim)}
.cres{margin-top:6px;display:grid;gap:8px}
.cres .t th{background:#241819;color:#c9a7ab;border-bottom-color:#3a262a}
.cres .t td{border-bottom-color:#2e1e20;color:var(--console-ink)}
.cres .t tbody tr:hover td{background:#2a1a1c}
.cres .kv{display:grid;grid-template-columns:130px 1fr;gap:3px 12px}
.cres .kv span:nth-child(odd){color:var(--console-dim)}
.cres .err{color:#ff8f86}
.cres .okc{color:#6fe0a0}
.cres .dim{color:var(--console-dim)}
.cres .pill.ok{background:#12301f;color:#6fe0a0}
.cres .pill.warn{background:#3a2c10;color:#f0c060}
.cres .pill.crit{background:#3d1b19;color:#ff9b92}
.cres .pill.info{background:#3a1b22;color:#f5a8bb}
.cres .mx td.q.l{background:#3a2c10;color:#f0c060}
.cres .mx td.q.z{background:#3d1b19;color:#ff9b92}
.cin{display:flex;align-items:center;gap:8px;border-top:1px solid #2e1e20;padding:0 16px}
.cin span{color:var(--console-accent)}
.cin input{background:transparent;border:0;color:var(--console-ink);font-family:var(--mono);padding:13px 0;outline:none}
.cin .cbtn{border:1px solid #3a262a;background:transparent;color:var(--console-ink);border-radius:4px;padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:12px}
.cin .cbtn:hover{border-color:var(--console-accent)}

.overlay{position:fixed;inset:0;background:rgba(8,14,20,.6);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px}
.chip.teach{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.sync.pending{color:var(--muted)}
.chip.sync.err{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.err{color:var(--crit)}
.foot{color:var(--muted);font-size:12px;padding:0 clamp(16px,3vw,32px) 24px}
.lines-t input[type=number]{width:70px}

@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login-side{padding:28px 20px;gap:18px}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;align-items:center;gap:2px}
  .side .wordmark,.org,.nav-sep{display:none}
  .nav{width:auto;white-space:nowrap}
  .nav.on{box-shadow:inset 0 -3px 0 #ff6b6b}
  .prod{grid-template-columns:1fr}
  .mailbox{grid-template-columns:1fr}
  .mailbox.sel .mlist{display:none}
  .mailbox:not(.sel) .mview{display:none}
  .back{display:inline-flex}
  .mlist{border-right:0}
  .dl{grid-template-columns:1fr}
  .top{flex-wrap:wrap}
  .top form{flex-basis:100%;order:3}
}
@media (max-width:520px){
  .sign{grid-template-columns:1fr}
}
</style>

<div id="app"></div>
<div id="dlg"></div>

<script type="module">
/* La configuration Firebase (clé, adresse enseignant) vit dans logisim-config.json,
   un fichier séparé que tu crées une fois dans GitHub et ne touches plus jamais :
   les futures mises à jour de ce fichier index.html n'y toucheront pas. */
var firebaseConfig=null,TEACHER_EMAIL='';
try{
  var cfgResp=await fetch('./logisim-config.json',{cache:'no-store'});
  if(cfgResp.ok){var cfg=await cfgResp.json();firebaseConfig=cfg.firebaseConfig||null;TEACHER_EMAIL=cfg.teacherEmail||''}
}catch(e){}
(function(){
'use strict';

/* ============================== Utilitaires ============================== */
var mem={};
var store={
  get:function(k){try{var v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return mem[k]!==undefined?mem[k]:null},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del:function(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* Logo LogiSim : un colis en contour. color peut être une couleur fixe (#ff6b6b sur fond sombre)
   ou "var(--accent)" pour suivre le thème clair/sombre sur fond clair. */
function logoMark(size,color){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 52 52" aria-hidden="true" focusable="false">'+
   '<g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" style="stroke:'+color+'">'+
   '<path d="M26 6 L46 16 V38 L26 48 L6 38 V16 Z"/><path d="M6 16 L26 26 L46 16"/><path d="M26 26 V48"/>'+
   '</g><path d="M14 11 L26 17" stroke-width="4" stroke-linecap="round" style="stroke:'+color+'"/></svg>';
}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}
function eur(n){return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}
function fdate(t){return new Date(t).toLocaleDateString('fr-FR')}
function fdt(t){return new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}
function pad(n,l){return String(n).padStart(l,'0')}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============================== Données de référence ============================== */
var ORGS=[
  {id:'p42',name:'Spartoo',sub:'Vente de chaussures en ligne',exo:'Exercice 1 : réception d\'une commande et bon de préparation',open:true},
  {id:'exo2',name:'Exercice 2 (à venir)',sub:'',exo:'',open:false}
];
var COLORS={NR:['Noir','#1f2124'],BL:['Blanc','#f4f4f1'],GR:['Gris','#8b9098'],MA:['Bleu marine','#22406e'],RG:['Rouge','#c23a2f'],BE:['Beige','#d9c4a1'],VE:['Vert','#33704f'],RS:['Rose','#e8a9ba'],MR:['Marron','#6d4b30']};
var ZONES={Running:'A',Lifestyle:'B',Skate:'C',Confort:'D',Bottes:'E'};

async function fbBackend(){
  var base='https://www.gstatic.com/firebasejs/10.14.1/';
  var mods=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  var AP=mods[0],AU=mods[1],FS=mods[2];
  var app=AP.initializeApp(firebaseConfig),auth=AU.getAuth(app),fs=FS.getFirestore(app);
  try{await AU.setPersistence(auth,AU.browserSessionPersistence)}catch(e){}
  function ready(){return new Promise(function(res){var off=AU.onAuthStateChanged(auth,function(u){off();res(u)})})}
  function isT(u){return !!(u&&u.email&&u.email.toLowerCase()===String(TEACHER_EMAIL).toLowerCase())}
  function ref(){return FS.doc.apply(null,[fs].concat([].slice.call(arguments)))}
  function authMsg(e){var c=(e&&e.code)||'';if(c==='auth/too-many-requests')return 'Trop d\'essais. Réessaie dans quelques minutes.';if(c==='auth/network-request-failed')return 'Pas de connexion réseau.';return 'Matricule inconnu ou incorrect.'}
  return {
    demo:false,
    restore:async function(){
      var u=await ready();if(!u)return null;
      if(isT(u))return {role:'teacher'};
      var s=await FS.getDoc(ref('students',u.uid));
      if(!s.exists()){await AU.signOut(auth);return null}
      return {role:'student',uid:u.uid,profile:s.data()};
    },
    loginStudent:async function(mat){
      var c;try{c=await AU.signInWithEmailAndPassword(auth,matEmail(mat),authPwd(mat))}catch(e){throw new Error(authMsg(e))}
      var s=await FS.getDoc(ref('students',c.user.uid));
      if(!s.exists()){await AU.signOut(auth);throw new Error('Ce compte n\'a pas de fiche élève. Préviens ton enseignant.')}
      return {role:'student',uid:c.user.uid,profile:s.data()};
    },
    loginTeacher:async function(){
      var c;try{c=await AU.signInWithPopup(auth,new AU.GoogleAuthProvider())}catch(e){throw new Error('Connexion Google impossible ou annulée.')}
      if(!isT(c.user)){await AU.signOut(auth);throw new Error('Ce compte Google n\'est pas autorisé.')}
      return {role:'teacher'};
    },
    logout:function(){return AU.signOut(auth)},
    getState:async function(uid,org){var s=await FS.getDoc(ref('students',uid,'state',org));return s.exists()?s.data():null},
    putState:function(uid,org,json,rev,stats){
      return Promise.all([
        FS.setDoc(ref('students',uid,'state',org),{json:json,rev:rev,by:CLIENT_ID,ts:Date.now()}),
        FS.updateDoc(ref('students',uid),{stats:stats,lastSeen:Date.now()})
      ]);
    },
    watchState:function(uid,org,cb){return FS.onSnapshot(ref('students',uid,'state',org),function(s){if(s.exists())cb(s.data())})},
    watchInbox:function(uid,cb){return FS.onSnapshot(FS.collection(fs,'students',uid,'inbox'),function(s){cb(s.docs.map(function(d){return {id:d.id,json:d.data().json}}))})},
    ackInbox:function(uid,id){return FS.deleteDoc(ref('students',uid,'inbox',id))},
    listStudents:async function(){var s=await FS.getDocs(FS.collection(fs,'students'));return s.docs.map(function(d){var x=d.data();x.uid=d.id;return x})},
    createStudents:async function(items,progress){
      var app2=AP.initializeApp(firebaseConfig,'creator'+Date.now()),auth2=AU.getAuth(app2),done=[],errs=[];
      for(var i=0;i<items.length;i++){
        var it=items[i];
        try{
          var c=await AU.createUserWithEmailAndPassword(auth2,matEmail(it.mat),authPwd(it.mat));
          await FS.setDoc(ref('students',c.user.uid),it.profile);
          await AU.signOut(auth2);done.push(it);
        }catch(e){errs.push(it.profile.prenom+' : '+((e&&e.code)||(e&&e.message)))}
        if(progress)progress(i+1,items.length);
      }
      try{await AP.deleteApp(app2)}catch(e){}
      return {done:done,errs:errs};
    },
    pushInbox:async function(uids,json){
      for(var i=0;i<uids.length;i+=400){
        var b=FS.writeBatch(fs);
        uids.slice(i,i+400).forEach(function(u){b.set(FS.doc(FS.collection(fs,'students',u,'inbox')),{json:json,ts:Date.now()})});
        await b.commit();
      }
    },
    getClassCode:async function(code){var s=await FS.getDoc(ref('classes',code));return s.exists()?(s.data().stockCode||''):''},
    setClassCode:async function(code,stockCode){return FS.setDoc(ref('classes',code),{stockCode:stockCode||'',updatedAt:Date.now()},{merge:true})},
    deleteStudents:async function(items){
      var refs=[];
      for(var i=0;i<items.length;i++){
        var uid=items[i].uid,org=items[i].org||'p42';
        var inbox=await FS.getDocs(FS.collection(fs,'students',uid,'inbox'));
        inbox.docs.forEach(function(d){refs.push(d.ref)});
        refs.push(ref('students',uid,'state',org));
        refs.push(ref('students',uid));
      }
      for(var j=0;j<refs.length;j+=450){
        var b=FS.writeBatch(fs);
        refs.slice(j,j+450).forEach(function(r){b.delete(r)});
        await b.commit();
      }
    }
  };
}

function demoBackend(){
  function g(k,d){try{var v=store.get('demo:'+k);return v?JSON.parse(v):d}catch(e){return d}}
  function s(k,v){store.set('demo:'+k,JSON.stringify(v))}
  var wInbox={};
  function fire(uid){(wInbox[uid]||[]).forEach(function(cb){cb(g('inbox',{})[uid]||[])})}
  return {
    demo:true,
    restore:async function(){return g('session',null)},
    loginStudent:async function(mat){
      var st=g('students',{}),uid=null;for(var k in st){if(st[k].matricule===mat)uid=k}
      if(!uid)throw new Error('Matricule inconnu ou incorrect.');
      var r={role:'student',uid:uid,profile:st[uid]};s('session',r);return r;
    },
    loginTeacher:async function(){var r={role:'teacher'};s('session',r);return r},
    logout:async function(){store.del('demo:session')},
    getState:async function(uid,org){return g('state',{})[uid+'/'+org]||null},
    putState:async function(uid,org,json,rev,stats){
      var a=g('state',{});a[uid+'/'+org]={json:json,rev:rev,by:CLIENT_ID,ts:Date.now()};s('state',a);
      var st=g('students',{});if(st[uid]){st[uid].stats=stats;st[uid].lastSeen=Date.now();s('students',st)}
    },
    watchState:function(){return function(){}},
    watchInbox:function(uid,cb){(wInbox[uid]=wInbox[uid]||[]).push(cb);setTimeout(function(){cb(g('inbox',{})[uid]||[])},0);return function(){wInbox[uid]=(wInbox[uid]||[]).filter(function(x){return x!==cb})}},
    ackInbox:async function(uid,id){var a=g('inbox',{});a[uid]=(a[uid]||[]).filter(function(x){return x.id!==id});s('inbox',a)},
    listStudents:async function(){var st=g('students',{});return Object.keys(st).map(function(k){var x=JSON.parse(JSON.stringify(st[k]));x.uid=k;return x})},
    createStudents:async function(items,progress){
      var st=g('students',{});
      items.forEach(function(it,i){st['u'+Math.random().toString(36).slice(2,10)]=it.profile;if(progress)progress(i+1,items.length)});
      s('students',st);return {done:items,errs:[]};
    },
    pushInbox:async function(uids,json){
      var a=g('inbox',{});
      uids.forEach(function(u){(a[u]=a[u]||[]).push({id:'m'+Math.random().toString(36).slice(2,10),json:json})});
      s('inbox',a);uids.forEach(fire);
    },
    getClassCode:async function(code){return g('classcodes',{})[code]||''},
    setClassCode:async function(code,stockCode){var a=g('classcodes',{});a[code]=stockCode||'';s('classcodes',a)},
    deleteStudents:async function(items){
      var st=g('students',{}),stt=g('state',{}),ib=g('inbox',{});
      items.forEach(function(it){delete st[it.uid];delete stt[it.uid+'/'+(it.org||'p42')];delete ib[it.uid]});
      s('students',st);s('state',stt);s('inbox',ib);
    }
  };
}

function syncLabel(){return S.sync==='ok'?'Enregistré':(S.sync==='pending'?'Enregistrement…':'Non enregistré')}
function saveDB(){if(!S.uid||!S.db)return;setSync('pending');clearTimeout(saveT);saveT=setTimeout(flush,500)}
async function flush(){
  clearTimeout(saveT);saveT=null;
  if(!S.uid||!S.db)return;
  var json=JSON.stringify(S.db);S.rev=(S.rev||0)+1;S.lastJson=json;
  try{await Backend.putState(S.uid,S.org,json,S.rev,statsOf(S.db));if(!saveT)setSync('ok')}catch(e){setSync('err')}
}
function stockOf(sku){var q=S.db.stock[sku];return q==null?0:q}
function logMove(sku,type,delta,ref){S.db.moves.push({ts:Date.now(),sku:sku,type:type,delta:delta,after:S.db.stock[sku],ref:ref||'Console',by:S.view?'Enseignant':S.user.prenom})}
/* Clients et fournisseurs : le carnet global (marques réelles, particuliers fictifs) complété par
   les fiches que l'élève crée lui-même via la console (.addclient / .addsupplier), propres à sa base. */
function allCustomers(){return CUSTOMERS.concat((S.db&&S.db.customers)||[])}
function allSuppliers(){return SUPPLIERS.concat((S.db&&S.db.suppliers)||[])}
function nextCode(list,prefix,width){
  var mx=0;list.forEach(function(x){var n=parseInt(String(x.id).replace(/\D/g,''),10);if(!isNaN(n)&&n>mx)mx=n});
  return prefix+pad(mx+1,width);
}

function stopWatch(){S.unwatch.forEach(function(f){try{f()}catch(e){}});S.unwatch=[]}
async function openBase(uid,profile,viewing){
  var org=profile.org||'p42';
  var st=await Backend.getState(uid,org),db=null;
  if(st){try{db=JSON.parse(st.json)}catch(e){db=null}}
  var fresh=!db||db.v!==1;
  if(fresh)db=newDB(profile);
  stopWatch();
  S.uid=uid;S.user=profile;S.org=org;S.db=db;S.rev=(st&&st.rev)||0;S.lastJson=st&&!fresh?st.json:'';S.view=!!viewing;S.sync='ok';
  S.route={v:'home'};S.mailSel=null;S.mailFolder='in';S.composing=false;S.tab={};S.wrongGuess={};S.wrongPrep={};S.stockUnlocked=false;S.stockCodeErr='';
  S.cons=[{cmd:null,html:'<span class="dim">Console LogiSim. Tape <b>.help</b> pour la liste des commandes.</span>'}];
  if(fresh)saveDB();
  if(!viewing){
    S.unwatch.push(Backend.watchState(uid,org,onRemoteState));
    S.unwatch.push(Backend.watchInbox(uid,onInbox));
  }
  renderApp();
}
function onRemoteState(d){
  if(!S.db||d.by===CLIENT_ID||d.json===S.lastJson)return;
  try{var nd=JSON.parse(d.json);if(nd&&nd.v===1){S.db=nd;S.lastJson=d.json;S.rev=Math.max(S.rev,d.rev||0);renderApp()}}catch(e){}
}
function onInbox(list){
  if(!S.db||S.view)return;
  var changed=false;
  list.forEach(function(x){
    var o=null;try{o=JSON.parse(x.json)}catch(e){}
    if(o&&!S.db.mails.some(function(m){return m.kind==='order'&&m.order.no===o.no})){
      addMail(S.db,{folder:'in',ts:o.date,from:'Site web Spartoo',fromMail:'no-reply@spartoo.example',to:S.user.prenom,subject:'Nouvelle commande web n° '+o.no,kind:'order',order:o});changed=true;
    }
    Backend.ackInbox(S.uid,x.id);
  });
  if(changed){saveDB();renderApp()}
}

/* ============================== Commandes : codes et statuts ============================== */
function orderTotals(o){
  var sub=0,pairs=0;o.lines.forEach(function(l){sub+=priceOf(l.sku)*l.qty;pairs+=l.qty});
  var ship=SHIP[o.ship][1];return {sub:sub,ship:ship,total:sub+ship,pairs:pairs};
}
function ostatus(o){
  if(!o.prep)return ['À préparer','warn'];
  if(o.prep.validated)return o.prep.complete?['Préparée','ok']:['Préparée (reliquat)','info'];
  var any=false;for(var k in o.prep.rows){var r=o.prep.rows[k];if(r.seen!==''||r.loc||r.qty!==''||r.status)any=true}
  return any?['En cours','info']:['À préparer','warn'];
}
function ensurePrep(o){
  if(o.prep)return;
  o.prep={rows:{},doc:false,validated:false};
  o.lines.forEach(function(l){o.prep.rows[l.sku]={seen:'',loc:'',qty:'',status:''}});
}
function rowFilled(r){return r.seen!==''&&r.seen!=null&&!!(r.loc&&r.loc.trim())&&r.qty!==''&&r.qty!=null&&!!r.status}
function statusLabel(s){return s==='ok'?'<span class="pill ok">Complet</span>':s==='warn'?'<span class="pill warn">Partiel</span>':s==='crit'?'<span class="pill crit">Rupture</span>':'<span class="muted">—</span>'}
function orderTable(o,withPrice){
  var h='<div class="scroll"><table class="t"><thead><tr><th>Réf.</th><th>Désignation</th><th>Couleur</th><th class="r">Taille</th><th class="r">Qté</th>'+(withPrice?'<th class="r">PU TTC</th><th class="r">Total</th>':'')+'</tr></thead><tbody>';
  o.lines.forEach(function(l){var v=VM[l.sku];h+='<tr><td class="ref">'+l.sku+'</td><td>'+esc(label(v))+'</td><td>'+swatch(v.color)+'</td><td class="r">'+v.size+'</td><td class="r">'+l.qty+'</td>'+(withPrice?'<td class="r">'+eur(v.model.price)+'</td><td class="r">'+eur(v.model.price*l.qty)+'</td>':'')+'</tr>'});
  return h+'</tbody></table></div>';
}
function orderMailBody(o){
  var c=CM[o.customerId],t=orderTotals(o);
  return '<p>Une nouvelle commande vient d\'être passée sur le site. Paiement par carte bancaire accepté.</p>'+
   '<div class="cols" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">'+
   '<div><div class="small muted">CLIENT</div><b>'+esc(c.prenom+' '+c.nom)+'</b><br>'+esc(c.adr)+'<br>'+c.cp+' '+esc(c.ville)+'<br><span class="mono small">'+c.email+' · '+c.tel+'</span></div>'+
   '<div><div class="small muted">COMMANDE</div><b class="mono">'+o.no+'</b><br>Date : '+fdt(o.date)+'<br>Livraison : '+SHIP[o.ship][0]+'<br>Code client : <span class="mono">'+c.id+'</span></div></div>'+
   orderTable(o,true)+
   '<div class="right">Sous-total '+eur(t.sub)+' · Port '+eur(t.ship)+' · <b>Total TTC '+eur(t.total)+'</b></div>';
}

/* Nouveau message vers un fournisseur (commande de réapprovisionnement) : l'élève rédige librement,
   l'outil retrouve dans le texte les références et quantités citées et répond automatiquement en
   rappelant le minimum de commande du fournisseur (respecté ou non). */
var SKU_RE=/\b([A-Z]{2,3}-[A-Z0-9]+-[A-Z]{2}-\d{2})\b[^0-9]{0,20}?(\d{1,4})/g;
function parseSkuQty(text,supId){
  var out=[],m;SKU_RE.lastIndex=0;
  while((m=SKU_RE.exec(text))){
    var sku=m[1].toUpperCase(),qty=parseInt(m[2],10),v=VM[sku];
    if(v&&v.model.sup===supId)out.push({sku:sku,qty:qty,v:v})
  }
  return out;
}
function sendSupplierOrder(){
  var selId=$('#compose-to').value,sup=SUP_BY_ID[selId]||(S.db.suppliers||[]).filter(function(s){return s.id===selId})[0];
  if(!sup){var b=$('#compose-form');return}
  var subj=($('#compose-subj').value||'').trim()||'Commande de réapprovisionnement';
  var body=($('#compose-body').value||'').trim();if(!body)return;
  addMail(S.db,{folder:'out',ts:Date.now(),from:S.user.prenom,fromMail:'',to:sup.contact,toMail:sup.email,subject:subj,kind:'text',text:body,read:true});
  var found=parseSkuQty(body,sup.id),total=0;found.forEach(function(x){total+=x.qty});
  var reply;
  if(!found.length){
    reply="Bonjour,\n\nNous ne parvenons pas à identifier, dans votre message, de référence "+sup.brand+" accompagnée d'une quantité claire. Merci de préciser pour chaque article sa référence exacte et la quantité souhaitée.\n\nCordialement,\n"+sup.contact+"\n"+sup.name;
  }else if(total<(sup.moq||0)){
    reply="Bonjour,\n\nNous avons bien reçu votre demande, pour un total de "+total+" paire"+(total>1?'s':'')+". Pour rappel, notre minimum de commande est de "+sup.moq+" paires : merci de compléter votre commande avant que nous puissions la traiter.\n\nCordialement,\n"+sup.contact+"\n"+sup.name;
  }else{
    reply="Bonjour,\n\nCommande bien reçue, pour un total de "+total+" paires : le minimum de commande ("+sup.moq+" paires) est respecté. Livraison prévue sous "+sup.delai+" jours.\n\nCordialement,\n"+sup.contact+"\n"+sup.name;
  }
  addMail(S.db,{folder:'in',ts:Date.now()+1000,from:sup.contact,fromMail:sup.email,to:S.user.prenom,subject:'RE : '+subj,kind:'text',text:reply,read:false});
  saveDB();S.composing=false;S.mailFolder='in';S.mailSel=null;renderApp();
}

function normLoc(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'')}

function setPrepField(sku,field,val){
  var o=getOrder(S.route.no);if(!o)return;var r=o.prep.rows[sku];if(!r)return;
  if(field==='seen'||field==='qty'){var n=parseInt(val,10);r[field]=isNaN(n)?'':Math.max(0,n)}
  else if(field==='loc'){r.loc=val}
  else if(field==='status'){r.status=val}
  o.prep.doc=false;saveDB();renderApp();
}
function bpDoc(o){
  var p=o.prep,c=CM[o.customerId];

  var missing=o.lines.filter(function(l){return p.rows[l.sku].qty<l.qty});
  var pairs=0;picks.forEach(function(l){pairs+=p.rows[l.sku].qty});
  var rows=picks.map(function(l,i){var v=VM[l.sku];return '<tr><td>'+(i+1)+'</td><td class="ref"><b>'+v.loc+'</b></td><td class="ref">'+l.sku+'</td><td>'+esc(label(v))+'</td><td>'+COLORS[v.color][0]+'</td><td class="r">'+v.size+'</td><td class="r"><b>'+p.rows[l.sku].qty+'</b></td><td class="r"><span class="box"></span></td></tr>'}).join('');
  var miss=missing.length?'<div><div class="lbl">Reliquat / articles non préparés</div><table class="t"><tbody>'+missing.map(function(l){var v=VM[l.sku];return '<tr><td class="ref">'+l.sku+'</td><td>'+esc(label(v))+'</td><td class="r">Manque '+(l.qty-p.rows[l.sku].qty)+' sur '+l.qty+'</td></tr>'}).join('')+'</tbody></table></div>':'';
  var foot=p.validated?'<div class="msg ok">Préparation validée : le stock a été diminué (voir Stock, Mouvements).</div>':
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="validate"'+(picks.length?'':' disabled')+'>Valider la préparation (sortie de stock)</button><button class="btn" data-act="copy-bp">Copier le bon en texte</button></div><div id="copy-msg" class="small muted"></div>';
  return '<div class="doc" id="bp"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div class="lbl">Spartoo · Entrepôt</div><h2>Bon de préparation BP-'+o.no.replace('CMD-','')+'</h2></div><div style="text-align:right"><div class="lbl">Édité le</div>'+fdt(Date.now())+'<br>par '+esc(S.user.prenom)+' ('+esc(S.user.classe)+')</div></div>'+
   '<div class="cols"><div><div class="lbl">Commande</div><b>'+o.no+'</b> du '+fdate(o.date)+'</div><div><div class="lbl">Destinataire</div>'+esc(c.prenom+' '+c.nom)+'<br>'+esc(c.adr)+'<br>'+c.cp+' '+esc(c.ville)+'</div><div><div class="lbl">Transport</div>'+SHIP[o.ship][0]+'</div></div>'+
   (picks.length?'<div class="scroll"><table class="t"><thead><tr><th>N°</th><th>Emplacement</th><th>Réf.</th><th>Article</th><th>Couleur</th><th class="r">Taille</th><th class="r">Qté</th><th class="r">Prélevé</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="right"><b>'+picks.length+' ligne'+(picks.length>1?'s':'')+' · '+pairs+' paire'+(pairs>1?'s':'')+'</b></div>':'<p>Aucun article disponible : rien à préparer.</p>')+
   miss+'<div class="sign"><div><div class="lbl">Préparateur</div></div><div><div class="lbl">Contrôle emballage</div></div></div></div>'+foot;
}

function validateBP(){
  var o=getOrder(S.route.no),p=o.prep,errs=[];
  o.lines.forEach(function(l){var r=p.rows[l.sku];if(r.qty>stockOf(l.sku))errs.push(l.sku)});
  if(errs.length){var b=$('#copy-msg');if(b)b.innerHTML='<span class="msg err">Le stock a changé pour : '+errs.join(', ')+'. Remplis de nouveau ces lignes.</span>';errs.forEach(function(k){p.rows[k]={seen:'',loc:'',qty:'',status:''}});p.doc=false;saveDB();return renderApp()}
  var complete=true;
  o.lines.forEach(function(l){var r=p.rows[l.sku];if(r.qty>0){S.db.stock[l.sku]-=r.qty;logMove(l.sku,'Sortie : préparation',-r.qty,'BP-'+o.no.replace('CMD-',''))}if(r.qty<l.qty)complete=false});
  p.validated=true;p.complete=complete;p.at=Date.now();saveDB();renderApp();
}
function copyBP(){

}

function adjust(kind,a){
  var ref=String(a[0]||'').toUpperCase(),q=parseInt(a[1],10);
  if(!ref||a[1]===undefined||isNaN(q)||q<0||String(q)!==String(a[1]).trim())throw new Error('Syntaxe : .'+(kind==='set'?'setstock':kind==='add'?'addstock':'removestock')+' <réf article> <quantité entière positive>');
  var v=VM[ref];if(!v)throw new Error('Référence article introuvable : '+esc(ref)+'. Il faut la référence complète (modèle-couleur-taille).');
  var old=stockOf(v.sku),nw=kind==='set'?q:(kind==='add'?old+q:old-q);
  if(nw<0)throw new Error('Stock insuffisant : '+old+' paire'+(old>1?'s':'')+' disponible'+(old>1?'s':'')+', impossible d\'en retirer '+q+'.');
  S.db.stock[v.sku]=nw;
  logMove(v.sku,kind==='set'?'Ajustement inventaire':(kind==='add'?'Entrée':'Sortie'),nw-old,'Console');saveDB();
  return '<span class="okc">OK</span> '+v.sku+' : '+old+' → <b>'+nw+'</b>';
}
function runCmd(text,from){
  text=String(text||'').trim();if(!text)return;
  S.hist.push(text);S.hi=S.hist.length;
  var res;
  if(text.charAt(0)!=='.')res='<span class="err">Une commande commence par un point. Tape .help pour la liste.</span>';
  else{
    var parts=text.slice(1).split(/\s+/),name=parts[0].toLowerCase(),c=CMDS[name];
    if(!c)res='<span class="err">Commande inconnue : .'+esc(name)+'. Tape .help.</span>';
    else{try{res=c[2](parts.slice(1))}catch(e){res='<span class="err">'+(e.message)+'</span>'}}
  }
  if(res===null){S.cons=[]}else S.cons.push({cmd:text,html:res});
  if(from==='top'||S.route.v!=='console')go('console');else renderMain();
  var i=$('#cin');if(i)i.focus();
}

/* ---- Espace enseignant ---- */
function tState(){
  if(!S.T)S.T={tab:'list',students:null,cls:'',msg:'',loading:false,created:null,track:{},trackLoading:false};

function cmpStu(a,b){return String(a.classe||'').localeCompare(String(b.classe||''),'fr')||String(a.prenom+a.nom).localeCompare(String(b.prenom+b.nom),'fr')}
async function loadStudents(keep){
  var T=tState();T.loading=true;renderTeacher();
  try{T.students=(await Backend.listStudents()).sort(cmpStu);if(!keep)T.msg=''}
  catch(e){T.msg='<span class="err">Lecture impossible : '+esc(e.message)+'</span>'}

function renderTeacher(){
  var T=tState(),st=T.students||[],classes=[];

  var body=T.tab==='list'?tList(st,classes):(T.tab==='create'?tCreate():(T.tab==='track'?tTrack(st,classes):tSend(st,classes)));
  app().innerHTML='<div style="max-width:1100px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:18px">'+
   '<div class="page-head"><div><div class="wordmark" style="color:var(--ink)">'+logoMark(24,'var(--accent)')+'Logi<span style="color:var(--accent)">Sim</span> <span class="pill info" style="vertical-align:4px">Enseignant</span></div><h1 style="margin-top:6px">Espace enseignant</h1></div><div style="display:flex;gap:8px"><button class="btn" data-act="t-reload">Actualiser</button><button class="btn" data-act="logout">Quitter</button></div></div>'+
   '<div class="tabs">'+tabs+'</div>'+(T.msg?'<div class="msg info">'+T.msg+'</div>':'')+body+'</div>';
  if(T.tab==='send'){fillColors();renderTLines()}

function classCodeOf(clsName){

  return s?(s.classeCode||clsName):clsName;

  var T=S.T;

    return '<tr><td>'+esc(s.prenom+(s.nom?' '+s.nom:''))+'</td><td>'+esc(s.classe)+'</td><td class="ref">'+esc(s.matricule)+'</td><td>'+(s.lastSeen?fdt(s.lastSeen):'<span class="muted">jamais</span>')+'</td><td class="r">'+(x.orders||0)+'</td><td class="r">'+(x.prepared||0)+'</td><td class="r">'+(x.unread||0)+'</td><td class="r" style="white-space:nowrap"><button class="btn sm" data-act="open-student" data-uid="'+s.uid+'">Ouvrir la base</button> <button class="btn sm" data-act="reset-one-ask" data-uid="'+s.uid+'">Réinitialiser</button></td></tr>';

async function createClass(){
  var name=$('#c-name').value.trim(),code=$('#c-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''),org=$('#c-org').value;
  var lines=$('#c-list').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),out=$('#c-out');
  if(!name||!code||!lines.length){out.innerHTML='<div class="msg err">Renseigne la classe, le code Darboux et au moins un élève.</div>';return}
  var used={};(S.T.students||[]).forEach(function(s){used[s.matricule]=1});
  /* Chaque ligne peut commencer par le numéro Darboux de l'élève (1 ou 2 chiffres).
     Sans numéro, le prochain numéro libre est attribué automatiquement. */
  var parsed=lines.map(function(l){
    var m=l.match(/^(\d{1,2})[\s.:)\-]*\s*(.*)$/);
    return m&&m[2]?{num:parseInt(m[1],10),name:m[2].trim()}:{num:null,name:l};
  });
  var taken={};parsed.forEach(function(p){if(p.num!=null)taken[p.num]=1});
  var next=1;
  parsed.forEach(function(p){if(p.num==null){while(taken[next])next++;p.num=next;taken[next]=1}});
  var dupErr=null,matsHere={};
  parsed.forEach(function(p){
    var mat=buildMat(code,p.num);
    if(matsHere[mat])dupErr='Le numéro '+pad(p.num,2)+' est utilisé deux fois.';
    matsHere[mat]=1;
  });
  if(dupErr){out.innerHTML='<div class="msg err">'+esc(dupErr)+'</div>';return}
  var items=parsed.map(function(p){
    var pr=p.name.split(/\s+/),m=buildMat(code,p.num);
    if(used[m]){out.innerHTML='<div class="msg err">Le matricule '+esc(m)+' existe déjà. Vérifie le code de classe et les numéros.</div>';return null}
    used[m]=1;
    return {mat:m,profile:{matricule:m,prenom:pr[0],nom:pr.slice(1).join(' '),classe:name,classeCode:code,org:org,createdAt:Date.now(),lastSeen:null,stats:{orders:0,prepared:0,unread:3,moves:0}}};
  });
  if(items.some(function(x){return !x}))return;
  $('#c-btn').disabled=true;out.innerHTML='<div class="msg info" id="c-prog">Création des comptes…</div>';
  try{
    var r=await Backend.createStudents(items,function(i,n){var p=$('#c-prog');if(p)p.textContent='Création des comptes : '+i+' / '+n});
    S.T.created=r.done;
    S.T.msg=r.errs.length?'<span class="err">Certains comptes n\'ont pas pu être créés : '+esc(r.errs.join(' ; '))+'</span>':'';
    S.T.students=(await Backend.listStudents()).sort(cmpStu);
  }catch(e){S.T.msg='<span class="err">Création impossible : '+esc(e.message)+'</span>'}
  renderTeacher();
}

/* ---- Suivi de l'exercice de prise en main (vue enseignant) ----
   Chaque étape sait vérifier, à partir de la base JSON d'un élève, si le travail attendu est fait.
   D'autres étapes pourront être ajoutées ici au fil de la reprise de l'exercice. */
function stockOfDb(db,sku){var q=db.stock[sku];return q==null?0:q}
var STEPS=[
  {id:'step1',short:'Réponse à Léa Dubois (stock Stan Smith blanches, T.44)',check:function(db){
    var q=(db.mails||[]).filter(function(m){return m.folder==='in'&&/dubois/i.test(m.from||'')&&/stan smith/i.test(m.subject||'')})[0];
    if(!q)return {status:'na',detail:''};
    var replies=(db.mails||[]).filter(function(m){return m.folder==='out'&&norm(m.to||'')===norm(q.from||'')&&norm(m.subject||'').indexOf(norm(q.subject||''))>=0}).sort(function(a,b){return a.ts-b.ts});
    if(!replies.length)return {status:'pending',detail:''};
    var reply=replies[replies.length-1],real=stockOfDb(db,'AD-STS-BL-44');
    var ok=new RegExp('\\b'+real+'\\b').test(reply.text||'');
    return {status:ok?'ok':'ko',detail:reply.text||'',ts:reply.ts};
  }},
  {id:'step2',short:'Commande CMD-048213 préparée et validée',check:function(db){
    var o=(db.orders||[]).filter(function(x){return x.no==='CMD-048213'})[0];
    if(!o)return {status:'na',detail:''};
    if(!o.prep||!o.prep.validated)return {status:'pending',detail:''};
    /* L'élève ne reçoit plus de retour immédiat pendant l'exercice (pas de bouton « Vérifier ») :
       la justesse de chaque ligne est calculée ici, une fois la préparation validée, à partir du stock
       réel reconstitué (stock actuel + quantité déjà sortie pour cette ligne) et de l'emplacement réel. */
    var lines=o.lines.map(function(l){
      var r=o.prep.rows[l.sku]||{},qty=(r.qty===''||r.qty==null)?0:r.qty;
      var real=stockOfDb(db,l.sku)+qty,v=VM[l.sku];
      var correctQty=Math.min(l.qty,real),correctStatus=real>=l.qty?'ok':(real===0?'crit':'warn');
      var seenOk=r.seen===real,locOk=normLoc(r.loc)===normLoc(v.loc),qtyOk=r.qty===correctQty,statusOk=r.status===correctStatus;
      return {sku:l.sku,ok:seenOk&&locOk&&qtyOk&&statusOk,seen:r.seen,real:real,loc:r.loc,realLoc:v.loc,qty:r.qty,correctQty:correctQty,status:r.status,correctStatus:correctStatus};
    });
    var allOk=lines.every(function(x){return x.ok});
    var detailLines=lines.map(function(x){
      return x.sku+' : '+(x.ok?'correct':'à corriger')+' — stock trouvé '+(x.seen===''?'(vide)':x.seen)+' (réel '+x.real+'), emplacement '+(x.loc||'(vide)')+' (réel '+x.realLoc+'), à préparer '+(x.qty===''?'(vide)':x.qty)+' (attendu '+x.correctQty+'), statut '+(x.status||'(vide)')+' (attendu '+statusLabel(x.correctStatus).replace(/<[^>]+>/g,'')+')';
    });
    var detail='Préparation validée le '+fdt(o.prep.at)+' — '+(o.prep.complete?'commande complète':'commande avec reliquat')+'.\n'+detailLines.join('\n');
    return {status:allOk?'ok':'ko',detail:detail,ts:o.prep.at};
  }},
  {id:'step3',short:'Réapprovisionnement envoyé à Puma (PM-SUE-NR-40)',check:function(db){
    var sup=SUP_BY_ID.F003;
    var mails=(db.mails||[]).filter(function(m){return m.folder==='out'&&norm(m.toMail||'')===norm(sup.email)}).sort(function(a,b){return a.ts-b.ts});
    if(!mails.length)return {status:'pending',detail:''};
    function evalMsg(msg){
      var found=parseSkuQty(msg.text||'',sup.id);
      var total=0,allExact=true;
      found.forEach(function(x){total+=x.qty;var cur=stockOfDb(db,x.sku),exp=x.v.model.max-cur;if(x.qty!==exp)allExact=false});
      var hasSue=found.some(function(x){return x.sku==='PM-SUE-NR-40'});
      var moqOk=total>=(sup.moq||0);
      var ok=found.length>0&&hasSue&&allExact&&moqOk;
      var lines=found.map(function(x){var cur=stockOfDb(db,x.sku),exp=x.v.model.max-cur;return x.sku+' : '+x.qty+' paire(s) demandée(s) (stock actuel '+cur+', maximum '+x.v.model.max+', quantité attendue '+exp+')'+(x.qty===exp?' — correct':' — à corriger')});
      var detail='Message envoyé le '+fdt(msg.ts)+' à '+sup.brand+' — total '+total+' paire'+(total>1?'s':'')+' (minimum requis '+sup.moq+').\n'+
       (found.length?lines.join('\n'):'Aucune référence '+sup.brand+' avec une quantité claire n\'a été reconnue dans ce message.')+
       (found.length&&!hasSue?'\nLa référence PM-SUE-NR-40 n\'apparaît pas dans ce message.':'');
      return {ok:ok,detail:detail,ts:msg.ts};
    }
    var evals=mails.map(evalMsg),best=evals.filter(function(e){return e.ok})[0]||evals[evals.length-1];
    return {status:best.ok?'ok':'ko',detail:best.detail,ts:best.ts};
  }}
];
function stepPill(st){

  if(st.status==='ok')return '<span class="pill ok">Réussi</span>';
  return '<span class="pill crit">À corriger</span>';
}

  try{

    if(val&&real&&val.toLowerCase()===real.toLowerCase()){S.stockUnlocked=true;S.stockCodeErr='';renderMain()}
    else{S.stockCodeErr='Code incorrect.';renderMain();var i=$('#stock-code-in');if(i){i.focus();i.select()}}
  }catch(e){S.stockCodeErr='Vérification impossible : '+e.message;renderMain()}
}
function confirmDlg(title,text,label,act,data){
  var attrs=Object.keys(data||{}).map(function(k){return ' data-'+k+'="'+esc(data[k])+'"'}).join('');
  $('#dlg').innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2><p>'+text+'</p><div class="acts"><button class="btn" data-act="dlg-close">Annuler</button><button class="btn danger" data-act="'+act+'"'+attrs+'>'+label+'</button></div></div></div>';
}

/* ============================== Événements ============================== */

   case 'back-list':backToList();break;
   case 'mail-open':mailOpen(parseInt(d.id,10));break;
   case 'mail-back':S.mailSel=null;renderApp();break;

   case 'reply-toggle':var f=$('#reply-form');f.hidden=!f.hidden;if(!f.hidden)$('#reply-t').focus();break;

   case 'compose-cancel':S.composing=false;renderApp();break;

   case 'validate':validateBP();break;
   case 'copy-bp':copyBP();break;
   case 'prod':go('product',{ref:d.ref});break;
   case 'tab':S.tab[d.k]=d.t;renderMain();break;

   case 'reset-do':S.db=newDB(S.user);$('#dlg').innerHTML='';S.mailSel=null;S.mailFolder='in';S.route={v:'home'};saveDB();renderApp();break;
   /* enseignant */
   case 'teacher-login':
     Backend.loginTeacher().then(function(){S.mode='teacher';S.T=null;S.tord=null;renderApp();loadStudents()},function(err){renderLogin(esc(err.message))});break;
   case 't-tab':tState().tab=d.t;S.T.msg='';renderTeacher();break;
   case 't-reload':loadStudents();break;
   case 'track-load':loadTrack();break;
   case 'view-answer':
     var trk=(S.T.track||{})[d.uid],s3=studentByUid(d.uid);
     if(trk&&!trk.error){var st2=trk.steps[d.step];infoDlg('Réponse de '+(s3?s3.prenom+' '+(s3.nom||''):''),st2&&st2.detail)}
     break;
   case 'open-student':
     var s=studentByUid(d.uid);if(s){openBase(s.uid,s,true).catch(function(err){S.T.msg='<span class="err">Ouverture impossible : '+esc(err.message)+'</span>';renderTeacher()})}break;
   case 'reset-one-ask':
     var s1=studentByUid(d.uid);if(s1)confirmDlg('Réinitialiser '+s1.prenom+' ?','La base de '+esc(s1.prenom+' '+(s1.nom||''))+' revient à son état de départ. Cette action est définitive.','Réinitialiser','reset-one-do',{uid:d.uid});break;
   case 'reset-one-do':
     var s2=studentByUid(d.uid);$('#dlg').innerHTML='';
     if(s2)resetStudent(s2).then(function(){S.T.msg='Base de '+esc(s2.prenom)+' réinitialisée.';return loadStudents(true)},function(err){S.T.msg='<span class="err">'+esc(err.message)+'</span>';renderTeacher()});break;
   case 'reset-class-ask':
     var n=((S.T.students||[]).filter(function(x){return x.classe===d.cls})).length;
     confirmDlg('Réinitialiser la classe ?','Les bases des '+n+' élèves de <b>'+esc(d.cls)+'</b> reviennent à leur état de départ. Cette action est définitive.','Réinitialiser la classe','reset-class-do',{cls:d.cls});break;
   case 'reset-class-do':
     $('#dlg').innerHTML='';S.T.msg='Réinitialisation en cours…';renderTeacher();
     Promise.all((S.T.students||[]).filter(function(x){return x.classe===d.cls}).map(resetStudent)).then(function(){S.T.msg='Classe '+esc(d.cls)+' réinitialisée.';return loadStudents(true)},function(err){S.T.msg='<span class="err">'+esc(err.message)+'</span>';renderTeacher()});break;
   case 'delete-class-ask':
     var nd=((S.T.students||[]).filter(function(x){return x.classe===d.cls})).length;

   case 'delete-class-do':
     $('#dlg').innerHTML='';var toDel=(S.T.students||[]).filter(function(x){return x.classe===d.cls});
     S.T.msg='Suppression en cours…';renderTeacher();
     Backend.deleteStudents(toDel).then(function(){S.T.cls='';S.T.msg='Classe '+esc(d.cls)+' supprimée.';return loadStudents(true)},function(err){S.T.msg='<span class="err">Suppression impossible : '+esc(err.message)+'</span>';renderTeacher()});break;
   case 'send-to-class':tState().tab='send';S.tord.target='c:'+d.cls;renderTeacher();break;
   case 't-add':tAdd($('#t-m').value+'-'+$('#t-k').value+'-'+$('#t-z').value,Math.max(1,Math.min(10,parseInt($('#t-n').value,10)||1)));renderTLines();break;
   case 't-del':S.tord.lines.splice(parseInt(d.i,10),1);renderTLines();break;
   case 't-rand':tRand();break;
   case 't-send':sendOrder();break;
   case 'copy-mats':
     var txt=S.T.created.map(function(c){return c.profile.prenom+' '+c.profile.nom+'\t'+c.profile.classe+'\t'+c.mat}).join('\n'),mm=$('#mats-msg');
     try{navigator.clipboard.writeText(txt).then(function(){mm.textContent='Liste copiée.'},function(){mm.textContent='Copie impossible ici : sélectionne le tableau à la souris.'})}catch(x){mm.textContent='Copie impossible ici : sélectionne le tableau à la souris.'}
     break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='login-form')doLogin();
  else if(id==='create-form')createClass();
  else if(id==='qcmd'){var i=$('#qin');var v=i.value;i.value='';runCmd(v,'top')}
  else if(id==='ccmd'){var c=$('#cin');var v2=c.value;c.value='';runCmd(v2,'console')}
  else if(id==='reply-form')sendReply();
  else if(id==='compose-form')sendSupplierOrder();
  else if(e.target.dataset&&e.target.dataset.act==='set-stock-code')saveStockCode(e.target.dataset.cls);
  else if(id==='stock-unlock-form')tryUnlockStock();
});
document.addEventListener('input',function(e){
  var f=e.target.dataset&&e.target.dataset.filter;
  if(f==='cat')updateCatalog();else if(f==='stock')updateStock();else if(f==='tiers')updateTiers();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.prepField)setPrepField(t.dataset.sku,t.dataset.prepField,t.value);
  else if(t.dataset&&t.dataset.filter)t.dataset.filter==='cat'?updateCatalog():t.dataset.filter==='stock'?updateStock():updateTiers();
  else if(t.id==='t-m')fillColors();
  else if(t.dataset&&t.dataset.tcls){loadClassCode(t.value)}
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t.id!=='cin'&&t.id!=='qin')return;
  if(e.key==='ArrowUp'&&S.hist.length){e.preventDefault();S.hi=Math.max(0,S.hi-1);t.value=S.hist[S.hi]||''}
  else if(e.key==='ArrowDown'&&S.hist.length){e.preventDefault();S.hi=Math.min(S.hist.length,S.hi+1);t.value=S.hist[S.hi]||''}
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&saveT)flush()});
window.addEventListener('pagehide',function(){if(saveT)flush()});

/* ============================== Démarrage ============================== */
(async function start(){
  app().innerHTML='<p style="padding:24px" class="muted">Chargement…</p>';
  try{Backend=DEMO?demoBackend():await fbBackend()}
  catch(e){app().innerHTML='<div style="padding:24px;max-width:560px"><div class="msg err">Impossible de charger Firebase : '+esc(e.message)+'. Vérifie la connexion et le fichier logisim-config.json.</div></div>';return}
  var r=null;try{r=await Backend.restore()}catch(e){}
  if(r&&r.role==='teacher'){S.mode='teacher';renderApp();loadStudents()}
  else if(r&&r.role==='student'){S.mode='student';try{await openBase(r.uid,r.profile,false)}catch(e){renderLogin()}}
  else renderLogin();
})();
})();
</script>
